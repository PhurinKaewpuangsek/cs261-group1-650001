<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSTU Login</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body>
    <div class="container">
        <div class="topbar">
            <div class="logo-text">
                <img src="/loginsource/panthip.png" alt="" class="pantip-logo">
            </div>
        </div>
        <div class="login-box">
            <div class="error-content">
                <img src="/loginsource/error.JPG" alt="" class="error">
                <h2>something went wrong<br>please try again</h2>
                <button class="tryagain" onclick="window.location.href='login.html'">
                    try again
                </button>
            </div>
            <a href="#" class="read-mode">Continue in read mode</a>
        </div>
    </div>

    <script src="loginscript.js"></script>
</body>

</html>
