<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSTU Login</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body>
    <div class="container">
        <div class="topbar">
            <div class="logo-text">
                <img src="/loginsource/panthip.png" alt="" class="pantip-logo">
            </div>
        </div>
        <div class="login-box">
            <img src="/loginsource/cstu.jpg" alt="CS TU Logo" class="logo">

            <form id="login-form">
                <input type="text" placeholder="student-id" required>
                <input type="password" placeholder="Password" required>
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <button type="submit" class="login-btn">Log in</button>
            </form>

            <a href="#" class="read-mode">Continue in read mode</a>
        </div>
    </div>

    <script src="loginscript.js"></script>
</body>

</html>
