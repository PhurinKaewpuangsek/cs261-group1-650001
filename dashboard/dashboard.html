<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSTU Pantip — Dashboard (log in)</title>
  <link rel="stylesheet" href="dashboard-style.css" />
</head>
<body class="page">
  <!-- Sidebar (ส้ม) -->
  <aside class="sidebar sidebar--orange">
    <div class="sidebar__section">
      <div class="logo">CSTU<span>pantip</span></div>
      <nav class="nav">
        <a class="nav__link" href="#"><span>🏠</span> home</a>
        <a class="nav__link" href="#"><span>📝</span> write review</a>
      </nav>
    </div>

    <div class="sidebar__section">
      <div class="avatar"><span class="avatar__icon">🕵️</span></div>
      <a class="logout" href="#" id="btnLogout">Log-out</a>
    </div>
  </aside>

  <!-- Main (ไล่เฉดส้มลงดำ) -->
  <main class="main main--grad-orange">
    <header class="toolbar">
      <button class="btn btn--circle" id="btnBack">‹</button>
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" type="text" placeholder="Search" />
      </div>
      <div class="filters" id="starFilters">
        <button class="chip" data-star="5">⭐ 5</button>
        <button class="chip" data-star="4">⭐ 4</button>
        <button class="chip" data-star="3">⭐ 3</button>
        <button class="chip" data-star="2">⭐ 2</button>
        <button class="chip" data-star="1">⭐ 1</button>
      </div>
    </header>

    <section id="reviewGrid" class="grid"></section>
  </main>

  <script src="dashboard-script.js"></script>
  <script>
    // หน้านี้ = โหมดล็อกอิน (เขียน/แก้รีวิวได้ภายหลัง)
    CSTU.initDashboard({ mode: 'login' });
  </script>
</body>
</html>
