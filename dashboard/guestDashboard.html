<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSTU Pantip — Dashboard (guest)</title>
  <link rel="stylesheet" href="dashboard-style.css" />
</head>
<body class="page">
  <!-- Sidebar (ดำ) -->
  <aside class="sidebar sidebar--black">
    <div class="sidebar__section">
      <div class="logo">
        CSTU<span>pantip</span>
        <div class="logo__sub">(read mode)</div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="#"><span>🏠</span> home</a>
        <a class="nav__link nav__link--disabled"><span>📝</span> please log in to write a review</a>
      </nav>
    </div>

    <div class="sidebar__section">
      <div class="avatar"><span class="avatar__icon">🕵️</span></div>
      <a class="logout" href="dashboard.html">Log in</a>
    </div>
  </aside>

  <!-- Main (ไล่เฉดดำ→ส้ม) -->
  <main class="main main--grad-black">
    <header class="toolbar">
      <button class="btn btn--circle" id="btnBack">‹</button>
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" type="text" placeholder="Search" />
      </div>
      <div class="filters" id="starFilters">
          <button class="chip" data-star="5">⭐ 5</button>
          <button class="chip" data-star="4">⭐ 4</button>
          <button class="chip" data-star="3">⭐ 3</button>
          <button class="chip" data-star="2">⭐ 2</button>
          <button class="chip" data-star="1">⭐ 1</button>
      </div>

    </header>

    <section id="reviewGrid" class="grid"></section>
  </main>

  <script src="dashboard-script.js"></script>
  <script>
    // หน้านี้ = โหมดผู้เยี่ยมชม (อ่านอย่างเดียว)
    CSTU.initDashboard({ mode: 'guest' });
  </script>
</body>
</html>
